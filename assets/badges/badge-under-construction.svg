<svg xmlns="http://www.w3.org/2000/svg" width="190" height="34" viewBox="0 0 190 34" role="img" aria-labelledby="title desc">
  <title id="title">Under construction</title>
  <desc id="desc">Animated badge with three dots appearing one at a time.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="188.5" height="32.5" rx="16.25"
        fill="url(#background)" stroke="#f0b429" stroke-width="1.5"/>

  <g fill="#f0b429" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace"
     font-size="13" font-weight="700">
    <text x="14" y="21.5">under construction<tspan>.<animate attributeName="opacity" dur="2s" repeatCount="indefinite" calcMode="discrete" values="0;1;1;1;0" keyTimes="0;0.20;0.40;0.95;1"/></tspan><tspan>.<animate attributeName="opacity" dur="2s" repeatCount="indefinite" calcMode="discrete" values="0;0;1;1;0" keyTimes="0;0.20;0.40;0.95;1"/></tspan><tspan>.<animate attributeName="opacity" dur="2s" repeatCount="indefinite" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.20;0.40;0.60;1"/></tspan></text>
  </g>
</svg>
