[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espresso3d"
version = "0.1.0"
description = "Local generator of 3D models from images"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# The basics for the app to open and export the lightweight formats. The
# 3D generation engines, the rig and the upscaler are deliberately left
# out: each has its own repository and weights of several GB (see the README).
dependencies = [
    "gradio>=6.0",
    "trimesh>=4.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.11",
    "fast-simplification>=0.1.7",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
espresso3d = "espresso3d.__main__:main"

[tool.setuptools.packages.find]
# This is the line that makes the src/ layout work: without it setuptools
# would look for packages at the root and find nothing.
where = ["src"]

[tool.pytest.ini_options]
# Lets `pytest` run straight from the repository, without installing the
# package first. Without this, the tests' `from espresso3d...` imports
# would fail with ModuleNotFoundError under the src/ layout.
pythonpath = ["src"]
testpaths = ["tests"]
